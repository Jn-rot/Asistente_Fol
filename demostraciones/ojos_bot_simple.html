<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ojos de Bot</title>
<style>
  :root{
    --glow: #4df3ff;
    --screen-bg: #060a12;
    --bezel: #0d131f;
  }
  html,body{
    margin:0; padding:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#02030a;
    font-family: sans-serif;
  }

  .screen{
    position:relative;
    width: 420px;
    height: 260px;
    background: var(--screen-bg);
    border-radius: 28px;
    box-shadow:
      0 0 0 6px var(--bezel),
      0 0 40px rgba(77,243,255,0.08),
      inset 0 0 40px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 60px;
    overflow:hidden;
  }

  /* leve viñeta y brillo de pantalla encendida */
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(77,243,255,0.05), transparent 70%);
    pointer-events:none;
  }

  .eye{
    position:relative;
    width: 60px;
    height: 90px;
    background: var(--glow);
    border-radius: 30px;
    box-shadow: 0 0 18px rgba(77,243,255,0.7), 0 0 40px rgba(77,243,255,0.3);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1), height 0.12s ease, border-radius 0.12s ease;
  }

  .eye.blink{
    height: 8px;
    border-radius: 6px;
  }

  .label{
    position:absolute;
    bottom: 14px;
    left:50%;
    transform: translateX(-50%);
    color: rgba(77,243,255,0.35);
    font-size: 10px;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="eye" id="eyeL"></div>
  <div class="eye" id="eyeR"></div>
  <div class="label">ONLINE</div>
</div>

<script>
  const screen = document.getElementById('screen');
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const maxX = 16;
  const maxY = 12;

  function handleMove(x, y){
    const rect = screen.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (x - cx) / (window.innerWidth / 2);
    const dy = (y - cy) / (window.innerHeight / 2);
    const ox = Math.max(-1, Math.min(1, dx)) * maxX;
    const oy = Math.max(-1, Math.min(1, dy)) * maxY;
    const transform = `translate(${ox}px, ${oy}px)`;
    eyeL.style.transform = transform;
    eyeR.style.transform = transform;
  }

  window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if(e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY);
  });

  function scheduleBlink(){
    const delay = 2500 + Math.random() * 4000;
    setTimeout(() => {
      eyeL.classList.add('blink');
      eyeR.classList.add('blink');
      setTimeout(() => {
        eyeL.classList.remove('blink');
        eyeR.classList.remove('blink');
      }, 140);
      scheduleBlink();
    }, delay);
  }
  scheduleBlink();
</script>
</body>
</html>
