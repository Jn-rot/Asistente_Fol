<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 0;background:#0a0e14;border-radius:16px;overflow:hidden">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Personaje 3D AURA: una esfera brillante con rostro sonriente rodeada de dos anillos giroscopio metálicos que giran en distintos ejes, con cuatro paneles tecnológicos en los nodos de intersección.</h2>

<div id="scene" style="width:480px;height:480px;perspective:1200px;position:relative">
  <div id="orbit" style="width:100%;height:100%;position:relative;transform-style:preserve-3d">

    <div id="core" style="position:absolute;top:50%;left:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7ff5e0,#1fb8a8 45%,#0a6b63 75%,#04302c 100%);box-shadow:0 0 60px 10px rgba(60,240,210,.55),inset -15px -15px 40px rgba(0,0,0,.5),inset 10px 10px 30px rgba(180,255,240,.3);animation:pulse 3.2s ease-in-out infinite">
      <svg viewBox="0 0 100 100" style="position:absolute;top:0;left:0;width:100%;height:100%">
        <ellipse cx="35" cy="46" rx="7" ry="10" fill="#04302c" opacity="0.9"/>
        <ellipse cx="65" cy="46" rx="7" ry="10" fill="#04302c" opacity="0.9"/>
        <path d="M32 66 Q50 82 68 66" stroke="#04302c" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
      </svg>
      <div style="position:absolute;top:18%;left:22%;width:34%;height:22%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);filter:blur(2px)"></div>
    </div>

    <div class="ring" style="width:340px;height:340px;top:50%;left:50%;margin:-170px 0 0 -170px;transform:rotateX(70deg) rotateZ(0deg);animation:spinZ 9s linear infinite">
      <div class="ringband"></div>
      <div class="node" style="top:-15px;left:50%;margin-left:-24px"><i class="ti ti-cloud" aria-hidden="true"></i></div>
      <div class="node" style="bottom:-15px;left:50%;margin-left:-24px"><i class="ti ti-bolt" aria-hidden="true"></i></div>
    </div>

    <div class="ring" style="width:300px;height:300px;top:50%;left:50%;margin:-150px 0 0 -150px;transform:rotateX(20deg) rotateY(70deg);animation:spinY 7s linear infinite">
      <div class="ringband" style="border-color:#8fd4ff"></div>
      <div class="node" style="top:50%;left:-15px;margin-top:-24px"><i class="ti ti-cpu" aria-hidden="true"></i></div>
      <div class="node" style="top:50%;right:-15px;margin-top:-24px"><i class="ti ti-wifi" aria-hidden="true"></i></div>
    </div>

    <div style="position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#dff;box-shadow:0 0 18px 6px rgba(150,255,230,.9);z-index:5"></div>
  </div>
</div>

<div style="margin-top:1.75rem;text-align:center">
  <div style="font-size:26px;font-weight:500;letter-spacing:.12em;color:#8ff5e0">AURA</div>
  <div style="font-size:13px;color:#6fd8c8;margin-top:2px;letter-spacing:.04em">Asistente flotante avanzado</div>
</div>

<div style="display:flex;gap:10px;margin-top:1.25rem">
  <button id="btnPulse" style="background:rgba(80,240,210,.1);border:0.5px solid rgba(120,255,220,.4);color:#8ff5e0;border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer">Reiniciar animación</button>
</div>
</div>

<style>
@keyframes spinZ{from{transform:rotateX(70deg) rotateZ(0deg)}to{transform:rotateX(70deg) rotateZ(360deg)}}
@keyframes spinY{from{transform:rotateX(20deg) rotateY(0deg)}to{transform:rotateX(20deg) rotateY(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 60px 10px rgba(60,240,210,.55),inset -15px -15px 40px rgba(0,0,0,.5),inset 10px 10px 30px rgba(180,255,240,.3)}50%{box-shadow:0 0 80px 18px rgba(60,240,210,.75),inset -15px -15px 40px rgba(0,0,0,.5),inset 10px 10px 30px rgba(180,255,240,.4)}}
.ring{position:absolute;transform-style:preserve-3d}
.ringband{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;border:14px solid #c9d8e0;box-shadow:0 0 20px rgba(150,220,255,.35),inset 0 0 20px rgba(0,0,0,.3);background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 40%)}
.node{position:absolute;width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#3a4a55,#1c262e);border:1px solid rgba(160,220,255,.5);display:flex;align-items:center;justify-content:center;color:#9fe8ff;font-size:20px;box-shadow:0 0 14px rgba(120,200,255,.5)}
</style>

<script>
document.getElementById('btnPulse').addEventListener('click',function(){
  var orbit=document.getElementById('orbit');
  var rings=orbit.querySelectorAll('.ring');
  rings.forEach(function(r){r.style.animation='none';void r.offsetWidth;});
  var core=document.getElementById('core');
  core.style.animation='none';void core.offsetWidth;
  setTimeout(function(){
    rings[0].style.animation='spinZ 9s linear infinite';
    rings[1].style.animation='spinY 7s linear infinite';
    core.style.animation='pulse 3.2s ease-in-out infinite';
  },20);
});
</script>
