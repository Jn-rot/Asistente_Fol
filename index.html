<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fol</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/claude.css">
    <link rel="stylesheet" href="css/face.css">

</head>

<body>

    <div class="container">

        <div class="entidad" id="entidad">

            <!-- Cara: AURA -->
            <div class="cara">

                <div class="aura-wrap">

                    <div id="scene" style="width:480px;height:480px;perspective:1200px;position:relative">
                        <div id="orbit" style="width:100%;height:100%;position:relative;transform-style:preserve-3d">

                            <div id="core" class="folio-core" style="position:absolute;top:50%;left:50%;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;animation:pulse 3.2s ease-in-out infinite">
<div class="eye-wrap">
                                    <div class="eye-core" id="eyeL"></div>
                                    <div class="eye-core" id="eyeR"></div>
                                </div>
                                <div class="face-indicators">
                            <div class="face-scan" style="display:none"></div>
                            <div class="face-dots" style="display:none"><span class="face-dot"></span><span class="face-dot"></span><span class="face-dot"></span></div>
                            <div class="face-eq" style="display:none"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
                            <div class="face-bar" style="display:none"></div>
                            <div class="face-z" style="display:none"><span>Z</span><span>Z</span></div>
                            <div class="face-mouth mouth"></div>
                            <div class="eye-x" style="display:none"></div>
                        </div>
                                                <div style="position:absolute;top:18%;left:22%;width:34%;height:22%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);filter:blur(2px)"></div>
                            </div>

                            <div class="ring" style="width:340px;height:340px;top:50%;left:50%;margin:-170px 0 0 -170px;transform:rotateX(70deg) rotateZ(0deg);animation:spinZ 9s linear infinite">
                                <div class="ringband"></div>
                                <div class="node" style="top:-15px;left:50%;margin-left:-24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg></div>
                                <div class="node" style="bottom:-15px;left:50%;margin-left:-24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
                            </div>

                            <div class="ring" style="width:300px;height:300px;top:50%;left:50%;margin:-150px 0 0 -150px;transform:rotateX(20deg) rotateY(70deg);animation:spinY 7s linear infinite">
                                <div class="ringband" style="border-color:#8fd4ff"></div>
                                <div class="node" style="top:50%;left:-15px;margin-top:-24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg></div>
                                <div class="node" style="top:50%;right:-15px;margin-top:-24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg></div>
                            </div>

                            <div style="position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#dff;box-shadow:0 0 18px 6px rgba(150,255,230,.9);z-index:5"></div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Zona de clic centrada en el diseño visible -->
            <div class="hit"></div>

            <!-- Chat expandido (dentro de la MISMA entidad) -->
            <div class="panel">

                <div class="cc">

                    <div id="sidebar-wrap">
                        <div id="rail" class="show">
                            <button class="rail-item primary" id="rail-expand" title="Mostrar barra lateral">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg>
                            </button>
                            <button class="rail-item" id="rail-new" title="Nueva conversación">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
                            </button>
                            <button class="rail-item" id="rail-search" title="Buscar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                            </button>
                        </div>

                        <aside id="sidebar" class="collapsed">
                            <div class="sb-header">
                                <div class="logo-mark">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.8 3.8L12 12l-6.8-3.9L12 4.3ZM5 9.3l6 3.4v6.9l-6-3.3V9.3Zm14 0v7l-6 3.3v-6.9l6-3.4Z"/></svg>
                                </div>
                                <div>
                                    <div class="sb-title">Fol</div>
                                </div>
                                <div class="sb-header-spacer"></div>
                                <button class="collapse-btn" id="collapse-btn" title="Contraer barra lateral">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/><path d="M14.5 9.5 12 12l2.5 2.5"/></svg>
                                </button>
                            </div>

                            <div class="sb-actions">
                                <button class="new-chat-btn" id="new-chat">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
                                    Nueva conversación
                                </button>
                                <div class="search-box">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                                    <input id="search-sessions" placeholder="Buscar conversaciones…" />
                                </div>
                            </div>

                            <div class="sb-section-label">Sesiones</div>
                            <div class="sessions" id="sessions"></div>

                        </aside>
                    </div>

                    <div id="main">
                        <div id="topbar">
                            <div class="topbar-left">
                                <div class="app-title">Fol</div>
                            </div>
                            <div class="topbar-right">
                                <button class="icon-btn" id="settings-btn" title="Ajustes de la cara">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                                </button>
                                <button class="collapse-chat-btn" id="minBtn" title="Colapsar">
                                    <svg width="19" height="19" viewBox="0 0 24 24">
                                        <defs>
                                            <radialGradient id="v-grad" cx="35%" cy="30%" r="90%">
                                                <stop offset="0%" stop-color="#7ff5e0"/>
                                                <stop offset="45%" stop-color="#1fb8a8"/>
                                                <stop offset="75%" stop-color="#0a6b63"/>
                                                <stop offset="100%" stop-color="#04302c"/>
                                            </radialGradient>
                                        </defs>
                                        <path d="M5.5 7 L12 15.5 L18.5 7 L18.5 9.6 L12 18.4 L5.5 9.6 Z" fill="url(#v-grad)"/>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div id="chat"></div>

                        <div id="input-area">
                            <div class="input-inner">
                                <div class="input-shell">
                                    <textarea id="msg-input" rows="1" placeholder="Escribe tu mensaje..."></textarea>
                                    <div class="input-toolbar">
                                        <div class="input-toolbar-left">
                                            <button class="icon-btn" id="mic" title="Hablar">
                                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 22h8"/></svg>
                                            </button>
                                        </div>
                                        <button class="send-btn" id="send-btn" disabled>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Ajustes de la cara -->
                <div id="settings-overlay" class="settings-overlay">
                    <div class="settings-card">
                        <div class="settings-head">
                            <div class="settings-title">Ajustes de la cara</div>
                            <button class="icon-btn" id="settings-close" title="Cerrar">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <div class="settings-field">
                            <div class="settings-row">
                                <label for="set-face">Color principal</label>
                                <input type="text" class="color-hex" id="set-face" value="#1fb8a8" spellcheck="false" maxlength="7" autocomplete="off">
                            </div>
                            <div class="color-swatches" data-target="set-face"></div>
                        </div>
                        <div class="settings-field">
                            <div class="settings-row">
                                <label for="set-glow">Brillo / aura</label>
                                <input type="text" class="color-hex" id="set-glow" value="#3cf0d2" spellcheck="false" maxlength="7" autocomplete="off">
                            </div>
                            <div class="color-swatches" data-target="set-glow"></div>
                        </div>
                        <div class="settings-field">
                            <div class="settings-row">
                                <label for="set-eye">Ojos</label>
                                <input type="text" class="color-hex" id="set-eye" value="#06453f" spellcheck="false" maxlength="7" autocomplete="off">
                            </div>
                            <div class="color-swatches" data-target="set-eye"></div>
                        </div>
                        <div class="settings-field">
                            <div class="settings-row">
                                <label for="set-mouth">Boca</label>
                                <input type="text" class="color-hex" id="set-mouth" value="#d7ebff" spellcheck="false" maxlength="7" autocomplete="off">
                            </div>
                            <div class="color-swatches" data-target="set-mouth"></div>
                        </div>
                        <div class="settings-field">
                            <div class="settings-row">
                                <label for="set-apikey">API key de Groq</label>
                                <button class="settings-mini" id="settings-save-key">Guardar</button>
                            </div>
                            <input type="password" class="apikey-input" id="set-apikey" placeholder="gsk_..." autocomplete="off" spellcheck="false">
                            <div class="settings-hint" id="apikey-estado">Se guarda cifrada en este equipo. Sin key el chat no funciona.</div>
                        </div>
                        <div class="settings-actions">
                            <button class="settings-reset" id="settings-reset">Restablecer</button>
                            <button class="settings-done" id="settings-done">Listo</button>
                        </div>
                    </div>
                </div>

                <!-- areas invisibles para redimensionar (expandido) -->
                <div class="rh rh-corner"></div>
                <div class="rh rh-bottom"></div>
                <div class="rh rh-right"></div>

            </div>

        </div>

    </div>

    <script src="js/chat.js"></script>
</body>

</html>
